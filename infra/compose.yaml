name: playground-local
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: playground
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-only
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playground"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/playground-realm.json:ro
      - identity:/opt/keycloak/data
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["artifacts:/data"]
volumes:
  pgdata:
  identity:
  artifacts:
